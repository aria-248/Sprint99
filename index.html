<style>

 --blue:#0a84ff;--indigo:#5e5ce6;--purple:#bf5af2;--pink:#ff375f;--red:#ff453a;--orange:#ff9f0a;--yellow:#ffd60a;--green:#30d158;--teal:#40c8e0;--mint:#63e6e2;--gray:#98989d;

}
/* colour moods */
[data-palette=ocean]{--a1:#0a84ff;--a2:#30b0c7;--a3:#34c759;--acc:#0a84ff}
[data-palette=sunset]{--a1:#ff9500;--a2:#ff2d55;--a3:#af52de;--acc:#f0470f}

[data-theme=dark][data-palette=lime]{--acc:#30d158}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink);font:16px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body{background:transparent}
[data-font=rounded] body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",-apple-system,system-ui,sans-serif}
[data-font=mono] .huge,[data-font=mono] h1,[data-font=mono] .kpi .v,[data-font=mono] .score,[data-font=mono] .bigtxt,[data-font=mono] .glass b,[data-font=mono] .pring b,[data-font=mono] .mini{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:-.03em}
[data-text=large] #app,[data-text=large] .sheet-card{zoom:1.1}
[data-motion=reduced] *,[data-motion=reduced] *::before,[data-motion=reduced] *::after{animation:none!important;transition:none!important}

button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;letter-spacing:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--fill2);border:1px solid transparent;border-radius:12px;padding:11px 13px;width:100%;outline:none;transition:.15s}

:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* background glow */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;width:54vmax;height:54vmax;border-radius:50%;filter:blur(80px);opacity:.34;animation:drift 26s ease-in-out infinite alternate}
.bgfx .b1{background:var(--a1);top:-20vmax;left:-14vmax}
.bgfx .b2{background:var(--a2);top:26vh;right:-22vmax;animation-duration:33s}
.bgfx .b3{background:var(--a3);bottom:-26vmax;left:18vw;animation-duration:39s;opacity:.26}
[data-theme=dark] .bgfx i{opacity:.24}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,4vmax) scale(1.14)}}

.side{display:none}

@media(max-width:899px){#main{padding-top:calc(10px + env(safe-area-inset-top,0px))}}

@media(min-width:900px){
 .side{display:flex;flex-direction:column;gap:2px;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:24px 14px;background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border-right:1px solid var(--gline)}
 main{padding:34px 40px 110px}
 .mtabs{display:none!important}
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.03em;padding:4px 10px 22px}
.brand small{display:block;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--hero);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;box-shadow:0 6px 16px color-mix(in srgb,var(--a2) 40%,transparent)}
.sb{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;font-weight:600;font-size:15px;color:var(--ink);width:100%;text-align:left;transition:.15s}
.sb:hover{background:var(--fill2)}.sb.on{background:var(--card);box-shadow:var(--sh)}
[data-theme=dark] .sb.on{background:var(--card2)}

.mtabs::-webkit-scrollbar{display:none}
.mt{display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 10px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink);background:var(--glass);border:1px solid var(--gline);white-space:nowrap;flex:none;box-shadow:var(--sh)}
.mt svg{color:var(--tc)}
.mt.on{background:var(--tc);color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--tc) 35%,transparent)}.mt.on svg{color:#fff}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
h1{font-size:32px;line-height:1.12;margin:2px 0 0;letter-spacing:-.035em;font-weight:800}
h2{font-size:19px;margin:0;letter-spacing:-.025em;font-weight:700}h3{font-size:16px;margin:0;font-weight:700;letter-spacing:-.02em}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--gline);color:var(--acc);flex:none;box-shadow:var(--sh);font-size:15px;font-weight:600}

.card{background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--gline);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
[data-glass=off] .card,[data-glass=off] .mt,[data-glass=off] .ib,[data-glass=off] .side,[data-glass=off] .mini{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none;border-color:transparent}
[data-contrast=high]{--muted:var(--ink2);--line:rgba(60,60,67,.5)}

[data-glass] .card.hero{background:var(--hero);background-size:220% 220%;backdrop-filter:none;-webkit-backdrop-filter:none;border:0}
[data-glass] .card.tip{background:linear-gradient(135deg,color-mix(in srgb,var(--yellow) 30%,var(--card)),color-mix(in srgb,var(--orange) 16%,var(--card)))}

.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}.top-a{align-items:flex-start}
.grid{display:grid;gap:12px}
.cards{margin-bottom:16px}.cards>.card{margin:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}.b{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);border-radius:999px;padding:11px 20px;font-weight:650;font-size:15px;white-space:nowrap;transition:transform .12s,filter .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}

.btn.sm{padding:7px 14px;font-size:14px}.btn.w{width:100%}
.btn.ok{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.btn.danger{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 15px;background:var(--fill2);font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.15s}
.chip.sm{padding:5px 12px;font-size:13px}
.chip.on,.chip:has(input:checked){background:var(--cc,var(--acc));color:#fff}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.chip:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.bar{height:8px;background:var(--fill);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;margin-right:7px;vertical-align:1px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill2);color:var(--muted);white-space:nowrap}
.badge.H{background:color-mix(in srgb,var(--pink) 14%,transparent);color:var(--pink)}.badge.M{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}
.badge.err{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}.badge.okb{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.kpi{margin:0;padding:16px;transition:transform .2s}

.kpi .l{font-size:13px;font-weight:600;color:var(--muted)}

.ring{--s:54px;width:var(--s);height:var(--s);border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--c) 16%,transparent) 0);display:grid;place-items:center;flex:none}
.ring>span{width:calc(var(--s) - 12px);height:calc(var(--s) - 12px);border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:800}

/* hero */
.hero{background:var(--hero);background-size:220% 220%;animation:herobg 16s ease-in-out infinite alternate;color:#fff;position:relative;overflow:hidden;padding:22px;border:0;box-shadow:0 18px 44px color-mix(in srgb,var(--a2) 34%,transparent)}
@keyframes herobg{from{background-position:0% 40%}to{background-position:100% 60%}}
.hero::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);top:-120px;right:-70px}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,10,.28),transparent 70%);bottom:-110px;left:-50px}
.hero>*{position:relative;z-index:1}
.hero .deco{position:absolute;right:-40px;bottom:-60px;width:260px;height:260px;z-index:0;opacity:.35;pointer-events:none}
.hero .deco circle{fill:none;stroke:#fff;stroke-width:1}
.hero .eyebrow{color:rgba(255,255,255,.82)}
.huge{font-size:60px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}

.av{--s:34px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);font-size:calc(var(--s)*.5);font-weight:800;color:#fff}
.side .av{background:var(--hero);border:0}

.seg.f{background:var(--purple)}.seg.p{background:var(--teal)}.seg.t{background:var(--orange)}

.hero .muted{color:rgba(255,255,255,.82)}

function pomoTick(){const p=ps();if(timing()&&p.running&&Date.now()>=p.endsAt)pomoEnd();else updPomoText()}
function updPomoText(){const p=ps();if(!timing()){if(document.title!==BASE_TITLE)document.title=BASE_TITLE;return}
 const left=pLeft(),txt=fmtClock(left),f=p.total?clamp(left/p.total,0,1):0;
 ['pomoTime','miniTime','cardTime'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=txt});
 ['pomoArc','miniArc'].forEach(id=>{const e=document.getElementById(id);if(e)e.setAttribute('stroke-dashoffset',(+e.dataset.c*(1-f)).toFixed(1))});
 document.title=(p.running?'':'⏸ ')+txt+' · '+(p.phase==='break'?'Break':'Focus')+' · Sprint99'}
function pomoEnd(){const p=ps();
 if(p.phase==='focus'){p.mins=Math.max(1,Math.round(p.total/60000));p.phase='log';p.running=false;p.left=0;if(p.logText==null)p.logText=p.text||'';p.date=TODAY();beep();Kit.save(S);toast('Session done · '+p.mins+' min. Log what you did.');if(!SHEET)openSheet('pomo');else if(SHEET.type==='pomo')renderSheet();celebrate(null)}
 else if(p.phase==='break'){p.phase='ready';p.running=false;p.left=0;beep();Kit.save(S);toast('Break’s over. Ready for the next one?');if(SHEET&&SHEET.type==='pomo')renderSheet()}
 ensureTick();renderMini();render()}
function renderMini(){const el=$('#mini');if(!el)return;const p=ps(),show=!!S.setup&&['focus','break','log','ready'].indexOf(p.phase)>=0&&!(SHEET&&SHEET.type==='pomo');
 if(!show){el.hidden=true;el.classList.remove('alert');return}el.hidden=false;
 if(p.phase==='log'||p.phase==='ready'){el.classList.add('alert');el.setAttribute('aria-label',p.phase==='log'?'Log your finished session':'Break is over');el.innerHTML=`<span class="pb">🍅</span>${p.phase==='log'?'Log your session':'Break’s over'}`;return}
 el.classList.remove('alert');const left=pLeft();el.setAttribute('aria-label','Open the Pomodoro timer');el.innerHTML=`${miniRing(left,p.total,p.phase==='break')}<span id="miniTime">${fmtClock(left)}</span><span class="tiny muted">${p.phase==='break'?'Break':p.running?'Focus':'Paused'}</span>`}
function pomoCard(){const p=ps(),pr=pp(),ts=sessionsOn(TODAY()),tm=ts.reduce((a,x)=>a+(+x.mins||0),0),active=timing();
 const lab=p.phase==='log'?'Log your session':p.phase==='ready'?'Start next session':active?'Open timer':'Start a session';
 return `<div class="card"><div class="row between wrap" style="gap:12px"><div class="row" style="gap:14px"><div class="pbig">${I.timer}</div><div><h2>Study sessions</h2><div class="tiny muted mt4">${ts.length} of ${pr.goal} today · ${tm} min${active?` · <b style="color:var(--acc)"><span id="cardTime">${fmtClock(pLeft())}</span> ${p.phase==='break'?'break':'left'}</b>`:''}</div></div></div><button class="btn sm ${active?'':'pri'}" data-act="pomoOpen">${active?'':I.play}${lab}</button></div><div class="mt12">${tomDots(ts.length,pr.goal)}</div>${ts.length?`<div class="row wrap mt12" style="gap:6px">${ts.map(itemChip).join('')}</div>`:`<p class="tiny muted" style="margin:10px 0 0">Pick a topic, run a ${pr.dur}-minute timer, then note what you learnt. It lands straight in today’s log.</p>`}</div>`}
function sheetPomo(){const p=ps(),pr=pp(),ts=sessionsOn(TODAY()),tm=ts.reduce((a,x)=>a+(+x.mins||0),0),sec=p.sec||'qa',tn=p.topic&&TP[p.topic]?TP[p.topic].name:'';
 const title={idle:'Plan a session',focus:p.running?'Focus':'Paused',break:'Break',log:'Log this session',post:'Nice work',ready:'Break’s over'}[p.phase]||'Pomodoro';
 let h=`<div class="sh-h"><div><div class="eyebrow">Pomodoro · ${ts.length} today · ${tm} min</div><h2 style="font-size:24px;margin-top:2px">${title}</h2></div>${closeBtn()}</div>`;
 const what=`<div class="small b mt12"><span class="dot" style="background:${SECS[sec].c}"></span>${SECS[sec].name}${tn?' · '+esc(tn):''}</div>${p.text?`<div class="tiny muted mt4">${esc(p.text)}</div>`:''}`;
 if(p.phase==='focus'||p.phase==='break'){const brk=p.phase==='break',left=pLeft();
  h+=`<div class="card" style="text-align:center"><div class="pring">${ringSvg(left,p.total,brk)}<div class="pt"><b id="pomoTime">${fmtClock(left)}</b><small>${brk?'Break':p.running?'Focus':'Paused'} · ${Math.round(p.total/60000)} min</small></div></div>${brk?'<div class="small muted mt12">Stand up, stretch, drink water. No phone scrolling.</div>':what}
   <div class="row wrap mt16" style="justify-content:center;gap:8px">${brk?`<button class="btn pri" data-act="pomoStart">${I.play}Skip break, start next</button><button class="btn" data-act="pomoPlus5">+5 min</button><button class="btn" data-act="pomoIdle">End break</button>`:`<button class="btn pri" data-act="${p.running?'pomoPause':'pomoResume'}">${p.running?I.pause+'Pause':I.play+'Resume'}</button><button class="btn" data-act="pomoPlus5">+5 min</button><button class="btn" data-act="pomoFinish">Finish &amp; log</button><button class="btn danger" data-act="pomoDiscard">${ARM==='pd'?'Tap again to discard':'Discard'}</button>`}</div></div>
   <p class="tiny muted" style="text-align:center">You can close this. The timer keeps running and a small ring stays in the corner.</p>`;return h}
 if(p.phase==='log'){const t=p.topic&&TP[p.topic];
  h+=`<div class="card">${what.replace('mt12','')}<div class="grid g2 mt12"><label>Minutes<input id="plMins" type="number" inputmode="numeric" min="1" max="600" value="${esc(p.mins)}"/></label><label>Add to date<input id="plDate" type="date" value="${esc(p.date||TODAY())}"/></label></div>
   <label class="mt12">What did you learn or do?<textarea id="plText" rows="3" placeholder="e.g. Relative speed finally clicked; solved 12 TSD questions">${esc(p.logText==null?(p.text||''):p.logText)}</textarea></label>
   <div class="grid mt12" style="grid-template-columns:1fr 1fr auto;align-items:end;gap:8px"><label>Questions tried<input id="plAtt" type="number" inputmode="numeric" min="0" value="${esc(p.att)}"/></label><label>Correct<input id="plCor" type="number" inputmode="numeric" min="0" value="${esc(p.cor)}"/></label><button class="chip ${p.timed?'on':''}" style="height:46px;--cc:var(--orange)" data-act="pomoTimed">⏱ Timed set</button></div>
   ${t?`<div class="tiny muted b mt12">Update ${esc(t.name)} · tap to move forward</div><div class="micro mt8" style="--c:${SECS[t.sec].c}">${t.subs.map((m,i)=>{const id=t.id+'.'+i,v=S.syl[id]||0;return `<button class="mc s${v}" data-act="mc" data-id="${id}"><span class="st">${v===3?'✓':''}</span>${esc(m)}</button>`}).join('')}</div>`:''}
   <button class="btn pri w mt16" data-act="pomoSave">Add to ${(p.date||TODAY())===TODAY()?'today’s':esc(fmt(parse(p.date)))+'’s'} log</button><button class="btn w mt8" data-act="pomoDiscard">${ARM==='pd'?'Tap again: don’t log it':'Don’t log this session'}</button></div>`;return h}
 if(p.phase==='post'||p.phase==='ready'){
  h+=`<div class="card" style="text-align:center"><div class="huge" style="font-size:46px">🍅 ${ts.length}</div><div class="b mt8">${ts.length===1?'session':'sessions'} today · ${tm} min</div><div class="mt12">${tomDots(ts.length,pr.goal)}</div>${ts.length>=pr.goal?'<div class="small mt8" style="color:var(--green);font-weight:700">Daily goal reached.</div>':''}
   <div class="row wrap mt16" style="justify-content:center;gap:8px">${p.phase==='post'?`<button class="btn pri" data-act="pomoBreak">Take a ${pr.brk}-min break</button>`:''}<button class="btn ${p.phase==='ready'?'pri':''}" data-act="pomoStart">${I.play}Start another (${SECS[sec].name}${tn?' · '+esc(tn):''})</button><button class="btn" data-act="pomoIdle">Change topic</button><button class="btn" data-act="pomoDone">Done for now</button></div></div>`;return h}
 const tops=ALLT.filter(t=>t.sec===sec);
 h+=`<div class="card"><div class="tiny muted b">Section</div><div class="row wrap mt8" style="gap:6px">${ORDER.map(k=>`<button class="chip ${sec===k?'on':''}" style="--cc:${SECS[k].c}" data-act="pomoSec" data-k="${k}">${SECS[k].name}</button>`).join('')}</div>
  <select id="pomoTopic" class="mt8" aria-label="Topic"><option value="">— General / other —</option>${tops.map(t=>`<option value="${t.id}" ${p.topic===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
  <input id="pomoText" class="mt8" maxlength="120" placeholder="What will you do? e.g. 2 RC passages, then review" value="${esc(p.text)}"/>
  <div class="tiny muted b mt16">Focus</div><div class="row wrap mt8" style="gap:6px">${[25,45,50,90].map(v=>`<button class="chip sm ${+pr.dur===v?'on':''}" data-act="pomoDur" data-v="${v}">${v} min</button>`).join('')}<label class="row" style="gap:6px;font-weight:600">or<input id="pomoDurC" type="number" inputmode="numeric" min="5" max="180" style="width:84px;padding:6px 10px" value="${[25,45,50,90].indexOf(+pr.dur)<0?pr.dur:''}" placeholder="min"/></label></div>
  <div class="tiny muted b mt12">Break</div><div class="row wrap mt8" style="gap:6px">${[5,10,15].map(v=>`<button class="chip sm ${+pr.brk===v?'on':''}" data-act="pomoBrk" data-v="${v}">${v} min</button>`).join('')}</div>
  <button class="btn pri w mt16" data-act="pomoStart">${I.play}Start ${pr.dur}-min session</button></div>
  <div class="card"><div class="row between wrap"><h3>Today</h3>${tomDots(ts.length,pr.goal)}</div>${ts.length?`<div class="mt8">${ts.map((it,i)=>`<div class="erow ${i?'':'first'}" style="${i?'':'border-top:0'}"><span class="dot" style="background:${SECS[it.sec]?SECS[it.sec].c:'var(--gray)'}"></span><div class="grow"><div class="small b">${esc(itemName(it))} <span class="badge">${it.mins} min</span></div>${it.topic&&it.text?`<div class="tiny muted">${esc(it.text)}</div>`:''}${it.att?`<div class="tiny muted">${it.cor||0}/${it.att} correct</div>`:''}</div></div>`).join('')}</div>`:'<p class="tiny muted">No sessions yet today.</p>'}
  <div class="setrow mt8"><span class="small b">Daily goal</span><div class="row wrap" style="gap:6px">${[2,4,6,8].map(v=>`<button class="chip sm ${+pr.goal===v?'on':''}" data-act="pomoGoal" data-v="${v}">${v}</button>`).join('')}</div></div>
  <div class="setrow"><span class="small b">Chime at the end</span><button class="chip sm ${pr.sound?'on':''}" data-act="pomoSound">${pr.sound?'On':'Off'}</button></div></div>`;
 return h}

/* ================= UI PIECES ================= */
function topBar(title,sub){const dark=document.documentElement.dataset.theme==='dark';return `<nav class="mtabs" aria-label="Sections">${NAV.map(([k,l])=>`<button class="mt ${S.ui.tab===k?'on':''}" style="--tc:${NAVC[k]}" data-act="nav" data-t="${k}">${I[k]}${l}</button>`).join('')}<button class="mt" style="--tc:${NAVC.me}" data-act="personal">${I.spark}Make it yours</button></nav><header class="top"><div class="grow"><div class="eyebrow">${esc(sub||'')}</div><h1>${esc(title)}</h1></div><div class="row" style="gap:8px"><button class="ib" data-act="theme" aria-label="Toggle dark mode">${dark?I.sun:I.moon}</button></div></header>`}
function kpi(l,v,s,c,ic){return `<div class="card kpi"><div class="kt" style="--kc:${c}">${ic}</div><div class="l">${l}</div><div class="v">${v}</div><div class="tiny muted">${s}</div></div>`}
function stat(l,v,s){return `<div><div class="tiny muted b">${l}</div><div class="b" style="font-size:21px;letter-spacing:-.03em">${v}</div><div class="tiny muted">${s||''}</div></div>`}
function timeline(n,p){const M=p.pe-p.F,pos=clamp((n-.5)/p.L,0,1)*100;return `<div class="tline">${p.F?`<div class="seg f" style="flex:${p.F}">Foundation</div>`:''}${M?`<div class="seg p" style="flex:${M}">Preparation + mocks</div>`:''}${p.TPd?`<div class="seg t" style="flex:${p.TPd}">Taper</div>`:''}${n>=1&&n<=p.L?`<div class="mark" style="left:${pos}%"></div>`:''}</div>`}
function secLegend(){return `<div class="row wrap tiny muted mt8" style="gap:14px;font-weight:600">${SK.map(k=>`<span><span class="dot" style="background:${SECS[k].c}"></span>${SECS[k].name}</span>`).join('')}</div>`}
function itemChip(it){return `<span class="ichip"><span class="dot" style="background:${SECS[it.sec]?SECS[it.sec].c:'var(--gray)'}"></span>${it.pomo?'🍅 ':''}${esc(itemName(it))}${it.mins?` · ${it.mins}m`:''}${it.att?` · ${it.cor||0}/${it.att}`:''}</span>`}
function rings(){const size=136,sw=14,gap=4;let g='';ORDER.forEach((k,i)=>{const pc=secStats(k).pct,r=size/2-sw/2-i*(sw+gap),C=2*Math.PI*r,off=C*(1-clamp(pc,0,100)/100);g+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:${SECS[k].c};opacity:.16" stroke-width="${sw}"/>${pc>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:${SECS[k].c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>`:''}`});return `<svg viewBox="0 0 ${size} ${size}" class="rings" role="img" aria-label="Micro-topics practised by section">${g}</svg>`}
function chart(series,labels,target,H){H=H||200;const W=640,Pd={l:36,r:12,t:14,b:24};const vals=series.flatMap(s=>s.v.filter(x=>x!=null&&!isNaN(x)));if(target!=null)vals.push(target);if(!vals.length)return '';
 let mn=Math.min(0,...vals),mx=Math.max(...vals);if(mx===mn)mx=mn+10;const pd=(mx-mn)*.12;mx+=pd;if(mn<0)mn-=pd;
 const n=Math.max(...series.map(s=>s.v.length)),iw=W-Pd.l-Pd.r,ih=H-Pd.t-Pd.b,X=i=>Pd.l+(n<=1?iw/2:i*iw/(n-1)),Y=v=>Pd.t+ih*(1-(v-mn)/(mx-mn));
 let g='',defs='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);g+=`<line x1="${Pd.l}" x2="${W-Pd.r}" y1="${y}" y2="${y}" class="gl"/><text x="${Pd.l-7}" y="${y+4}" class="ax" text-anchor="end">${Math.round(v)}</text>`}
 if(mn<0){const y=Y(0);g+=`<line x1="${Pd.l}" x2="${W-Pd.r}" y1="${y}" y2="${y}" class="zl"/>`}
 if(target!=null){const y=Y(target);g+=`<line x1="${Pd.l}" x2="${W-Pd.r}" y1="${y}" y2="${y}" class="tgt"/>`}
 const step=Math.ceil(n/8);labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${X(i)}" y="${H-6}" class="ax" text-anchor="middle">${esc(l)}</text>`});
 series.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
  if(series.length===1&&pts.length>1){const gid='cg'+(++CG),base=Y(Math.max(mn,0));defs+=`<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${s.c};stop-opacity:.32"/><stop offset="1" style="stop-color:${s.c};stop-opacity:0"/></linearGradient>`;g+=`<path d="M${pts[0][0]},${base} L${pts.map(q=>q.join(',')).join(' L')} L${pts[pts.length-1][0]},${base} Z" fill="url(#${gid})"/>`}
  if(pts.length>1)g+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" style="fill:none;stroke:${s.c};stroke-width:3;stroke-linejoin:round;stroke-linecap:round"/>`;
  pts.forEach(q=>{g+=`<circle cx="${q[0]}" cy="${q[1]}" r="4.5" style="fill:var(--card);stroke:${s.c};stroke-width:2.5"/>`})});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart"><defs>${defs}</defs>${g}</svg>`}
function actionRow(a,i){const b=a.btn;return `<div class="act ${i===0?'first':''}"><div class="an">${i+1}</div><div class="grow"><div class="eyebrow" style="color:${a.col||'var(--muted)'}">${esc(a.label)}</div><div class="b" style="font-size:17px;margin-top:2px">${esc(a.title)}</div><div class="small mt4">${esc(a.sub)}</div>${a.why?`<div class="tiny muted mt4">${a.why.map(esc).join(' · ')}</div>`:''}</div><button class="btn sm ${i===0?'pri':''}" data-act="${b[1]}" ${b[1]==='madd'?`data-dk="${b[2]}"`:`data-id="${b[2]}"`}>${b[0]}</button></div>`}
function stageRow(k,i){const r=readiness(k),idx=STG.indexOf(r.stage);return `<div class="frow ${i===0?'first':''}"><span class="dot" style="background:${SECS[k].c};width:12px;height:12px"></span><div class="grow"><div class="b">${SECS[k].name}</div><div class="tiny muted">${esc(r.why)}</div></div><div style="text-align:right;--sc:${STC[r.stage]}"><span class="stage">${r.stage}</span><div class="ladder mt8">${STG.map((_,j)=>`<i class="${j<=idx?'on':''}"></i>`).join('')}</div></div></div>`}
function notices(){let h='';
 if(RECOV)h+=`<div class="card note2"><div class="grow small">We restored your plan from a recovery copy saved ${esc(ago(RECOV))}.</div><button class="btn sm" data-act="dismissrec">OK</button></div>`;
 if(Kit.store&&Kit.store.kind==='memory')h+=`<div class="card note2 bad"><div class="grow small">This browser isn’t letting Sprint99 save. Download a backup before you close it.</div><button class="btn sm pri" data-act="exp">Download backup</button></div>`;
 if(Kit.status.error)h+=`<div class="card note2 bad"><div class="grow small">${esc(Kit.status.error)}</div><button class="btn sm pri" data-act="exp">Download backup</button></div>`;
 if(Kit.status.otherTab)h+=`<div class="card note2"><div class="grow small">Sprint99 was changed in another tab.</div><button class="btn sm" data-act="reload">Reload</button></div>`;
 if(Kit.file.state==='paused')h+=`<div class="card note2"><div class="grow small">Your autosave file is paused until you allow it again.</div><button class="btn sm" data-act="fresume">Resume</button></div>`;
 if(!Kit.meta.protectSeen&&Kit.store&&Kit.store.kind!=='memory')h+=`<div class="card note2"><div class="kt" style="--kc:var(--green);margin:0">${I.shield}</div><div class="grow small"><b>Your plan saves automatically on this device.</b> For extra safety, keep a backup file somewhere else too (Drive, or a chat with yourself).</div><button class="btn sm pri" data-act="exp">Download backup</button><button class="btn sm" data-act="protectseen">Got it</button></div>`;
 else if(Kit.needsBackup())h+=`<div class="card note2"><div class="kt" style="--kc:var(--green);margin:0">${I.shield}</div><div class="grow small"><b>Protect your prep.</b> It’s been a while since your last backup file.</div><button class="btn sm pri" data-act="exp">Back up</button><button class="btn sm" data-act="snooze">Later</button></div>`;
 return h}
function consistency(p,n0){const last=clamp(n0,0,p.L);if(last<1)return '';let h='',done=0;
 for(let n=1;n<=last;n++){const dt=dateOfDay(n),dk=dkey(dt),r=S.days[dk],d=r&&r.done,lg=r&&(r.items||[]).length,mk=isMock(n);if(d)done++;h+=`<i class="${d?'d':lg?'l':''}${mk?' m':''}${n===n0?' t':''}" title="${esc(fmtLong(dt))}${d?' · complete':lg?' · logged':''}${mk?' · mock day':''}"></i>`}
 const got=ACH.filter(a=>S.ach[a.id]).length;
 return `<div class="card"><div class="row between wrap"><h2>Consistency</h2><span class="tiny muted">${streak()}-day streak · ${Math.round((S.focusMin||0)/6)/10} session hours</span></div><div class="dots" role="img" aria-label="${done} of ${last} plan days complete">${h}</div><div class="legend2 mt12"><span><i class="sw" style="background:linear-gradient(135deg,var(--a1),var(--a2))"></i>Complete</span><span><i class="sw" style="background:color-mix(in srgb,var(--acc) 38%,transparent)"></i>Logged</span><span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--blue)"></i>Mock day</span></div><div class="row between mt16"><h3>Milestones</h3><span class="tiny muted b">${got} / ${ACH.length}</span></div><div class="achs">${ACH.map(a=>`<span class="ach ${S.ach[a.id]?'on':''}" title="${S.ach[a.id]?'Unlocked '+esc(fmt(parse(S.ach[a.id]))):'Not yet'}">${S.ach[a.id]?'★ ':''}${esc(a.n)}</span>`).join('')}</div></div>`}

function viewToday(){const p=P(),now=new Date(),n0=dayNo(now),ph=phaseN(n0,p),dk=dkey(now),rec=S.days[dk]||{items:[]},toExam=diffDays(now,p.ex),planPct=clamp(Math.round(clamp(n0,0,p.L)/p.L*100),0,100),nm=nextMock(n0);
 const desc=ph==='pre'?'Your plan starts on '+fmtLong(p.st)+'.':ph==='found'?'Open workspace — log whatever you study. Preparation starts '+fmt(dateOfDay(p.F+1))+(nm?' · first mock '+fmt(nm):'')+'.':ph==='prep'?(nm?(dkey(nm)===dk?'Mock day today.':'Next mock: '+fmtLong(nm)+'.'):'No more mocks scheduled.'):ph==='taper'?'Light sectionals, error-log revision and rest.':'Review your playbook and error log.';

 if(n0>=1&&n0<=p.L){const items=rec.items||[],mt=isMock(n0),lg=S.mocks.filter(m=>m.date===dk);
  h+=`<div class="card"><div class="row between"><div><h2>Today</h2><div class="tiny muted mt4">${PHN[ph]}${mt?' · Mock #'+mockNoOf(n0):''}${rec.hrs?' · '+esc(rec.hrs)+' h studied':''}</div></div><button class="btn sm ${rec.done?'ok':'pri'}" data-act="daydone" data-dk="${dk}">${rec.done?'✓ Complete':'Mark complete'}</button></div>`;
  if(lg.length)h+=lg.map(m=>{const r=mockCalc(m);return `<div class="mrow mt12"><span class="mk done">M</span><div class="grow small"><b>${esc(m.name)}</b> · ${r.tot} marks · analysis ${r.ana}/4</div><button class="btn sm" data-act="mopen" data-id="${m.id}">Open</button></div>`}).join('');
  else if(mt)h+=`<div class="mrow mt12"><span class="mk">M${mockNoOf(n0)}</span><div class="grow small b">Mock scheduled today</div><button class="btn sm pri" data-act="madd" data-dk="${dk}">Log mock</button></div>`;
  h+=`<div class="mt12">${items.length?`<div class="tiny muted b">Covered today</div><div class="row wrap mt8" style="gap:6px">${items.map(itemChip).join('')}</div>`:`<p class="small muted" style="margin:0">Nothing logged yet. Start a study session below and it logs itself, or add what you studied by hand.</p>`}</div><button class="btn w mt12" data-act="dayopen" data-dk="${dk}">+ Log by hand</button></div>`}

 const st=secStats(),rs=sortedAsc().map(mockCalc),l3=rs.slice(-3),p3=rs.slice(-6,-3),a3=l3.length?avg(l3.map(r=>r.tot)):null,b3=p3.length?avg(p3.map(r=>r.tot)):null,sch=mockNoOf(clamp(n0,0,p.L));
 h+=`<div class="grid g4 cards">${kpi('Syllabus',st.pct+'%',st.left+' micro-topics to go','var(--green)',I.syllabus)}${kpi('Mocks',S.mocks.length,sch?sch+' scheduled so far':'none scheduled yet','var(--blue)',I.mocks)}${kpi('Avg score',a3==null?'—':Math.round(a3),a3==null?'last 3 mocks':(b3!=null?delta(a3-b3)+' vs previous 3':'last '+l3.length+' mock'+(l3.length>1?'s':'')),'var(--purple)',I.insights)}${kpi('Streak',streak()+'d','days marked complete','var(--orange)',I.flame)}</div>`;
 h+=consistency(p,n0);

function viewPlan(){const p=P(),s=S.setup,v=S.ui.planView||'cal',n0=dayNo();let tot=0,done=0;for(let i=1;i<=p.L;i++){if(isMock(i))tot++;const r=S.days[dkey(dateOfDay(i))];if(r&&r.done)done++}
 let h=topBar('Plan',fmt(p.st)+' → CAT '+fmt(p.ex));
 h+=`<div class="card"><div class="grid g4" style="gap:14px">${stat('Foundation',p.F?p.F+' days':'None',p.F?fmt(p.st)+' – '+fmt(dateOfDay(p.F)):'')}${stat('Preparation',(p.pe-p.F)+' days',p.pe>p.F?fmt(dateOfDay(p.F+1))+' – '+fmt(dateOfDay(p.pe)):'')}${stat('Mocks',tot+' scheduled',mockRule(s))}${stat('Taper',p.TPd?p.TPd+' day'+(p.TPd>1?'s':''):'None','before CAT')}</div>${timeline(n0,p)}<div class="row between wrap mt12" style="gap:8px"><span class="tiny muted">${done}/${p.L} days complete · tap any date to log study, mark it done or add/remove a mock</span><button class="btn sm" data-act="editplan">Edit plan</button></div></div>`;
 h+=`<div class="row between wrap" style="margin-bottom:14px;gap:12px"><div class="seg2">${[['cal','Calendar'],['list','List']].map(([k,l])=>`<button class="${v===k?'on':''}" data-act="pview" data-v="${k}">${l}</button>`).join('')}</div><div class="legend2"><span><i class="sw" style="background:var(--ph-f)"></i>Foundation</span><span><i class="sw" style="background:var(--ph-p)"></i>Preparation</span><span><i class="sw" style="background:var(--ph-t)"></i>Taper</span><span><span class="mk">M</span> mock</span><span><span class="mk done">M</span> logged</span></div></div>`;
 return h+(v==='cal'?calendar(p,n0):listView(p,n0))}
function calendar(p,n0){let h='',y=p.st.getFullYear(),m=p.st.getMonth(),g=0;const ey=p.ex.getFullYear(),em=p.ex.getMonth();while((y<ey||(y===ey&&m<=em))&&g++<24){h+=monthGrid(y,m,p,n0);m++;if(m>11){m=0;y++}}return h}
function monthGrid(y,m,p,n0){const d1=new Date(y,m,1),lead=(d1.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let c=WD.map(w=>`<div class="wd">${w}</div>`).join('');for(let i=0;i<lead;i++)c+='<div></div>';
 for(let d=1;d<=days;d++){const dt=new Date(y,m,d),n=diffDays(p.st,dt)+1,ph=phaseN(n,p),dk=dkey(dt);
  if(ph==='pre'||ph==='post'){c+=`<div class="cd off"><span class="dn">${d}</span></div>`;continue}
  if(ph==='exam'){c+=`<div class="cd ph-exam ${n===n0?'today':''}"><span class="dn">${d}</span><span class="mk ex">CAT</span></div>`;continue}
  const rec=S.days[dk]||{},mk=isMock(n),lg=S.mocks.some(x=>x.date===dk),ni=(rec.items||[]).length;
  c+=`<button class="cd ph-${ph} ${n===n0?'today':''} ${rec.done?'done':''}" data-act="dayopen" data-dk="${dk}" aria-label="${esc(fmtLong(dt))}${mk?', mock day':''}${rec.done?', complete':''}"><span class="dn">${d}</span>${rec.done?'<span class="ck">✓</span>':''}<span class="cf">${mk?`<span class="mk ${lg?'done':''}">M${mockNoOf(n)}</span>`:''}${ni?`<span class="ni">${ni}</span>`:''}</span></button>`}
 return `<div class="card"><h2>${d1.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><div class="cal mt12">${c}</div></div>`}
function listView(p,n0){let h=`<div class="row" style="margin-bottom:12px"><button class="btn sm" data-act="jumptoday">Jump to today</button></div><div class="card" style="padding:4px 14px">`;
 for(let n=1;n<=p.L;n++){const dt=dateOfDay(n),dk=dkey(dt),ph=phaseN(n,p),rec=S.days[dk]||{},its=rec.items||[],mk=isMock(n),lg=S.mocks.filter(x=>x.date===dk);
  const sum=lg.map(m=>esc(m.name)+' · '+mockCalc(m).tot+' marks').concat(its.map(it=>(it.pomo?'🍅 ':'')+esc(itemName(it)))).join(', ')||'<span class="muted">Nothing logged</span>';
  h+=`<div class="lrow ${n===1?'first':''} ${n===n0?'today':''}" id="d_${dk}"><span class="phbar ph-${ph}"></span><button class="cb ${rec.done?'on':''}" data-act="daydone" data-dk="${dk}" aria-label="Mark complete">${rec.done?I.check:''}</button><button class="grow lbtn" data-act="dayopen" data-dk="${dk}"><div class="small b">${esc(fmtLong(dt))} <span class="tiny muted" style="font-weight:500">· Day ${n}${rec.hrs?' · '+esc(rec.hrs)+' h':''}</span></div><div class="tiny">${sum}</div></button>${mk?`<span class="mk ${lg.length?'done':''}">M${mockNoOf(n)}</span>`:''}</div>`}
 return h+`<div class="lrow"><span class="phbar ph-exam"></span><div class="grow small b" style="padding:12px 0">${esc(fmtLong(p.ex))} · CAT</div></div></div>`}

function sylList(){const sec=S.ui.sylSec||'qa',f=S.ui.sylF||'all';if(f==='weak'){const R=topicPerf(),ta=S.setup.acc/100;return ALLT.filter(t=>{const r=R[t.id];return r.e||(r.att>=5&&r.cor/r.att<ta)}).sort((a,b)=>R[b.id].e-R[a.id].e)}let l=ALLT.filter(t=>t.sec===sec);if(f==='todo')l=l.filter(t=>topicStats(t).done<t.subs.length);if(f==='high')l=l.filter(t=>t.w==='H');return l}
function topicCard(t,R){const st=topicStats(t),op=!!S.ui.open[t.id],pc=Math.round(st.done/st.total*100),r=R[t.id],acc=r.att>=5?r.cor/r.att:null,ta=S.setup.acc/100;
 return `<div class="card topic" id="t_${t.id}" style="--c:${SECS[t.sec].c}"><button class="thead" data-act="topen" data-id="${t.id}" aria-expanded="${op}"><div class="grow"><div class="row wrap" style="gap:6px"><span class="b" style="font-size:16px">${esc(t.name)}</span><span class="badge ${t.w}">${WN[t.w]}</span>${st.mast===st.total?'<span class="badge okb">★ Mastered</span>':''}${acc!=null?`<span class="badge ${acc<ta?'err':'okb'}">${Math.round(acc*100)}% acc</span>`:''}${r.e?`<span class="badge err">${r.e} mistake${r.e>1?'s':''}</span>`:''}${S.ui.sylF==='weak'?`<span class="badge">${SECS[t.sec].name}</span>`:''}</div><div class="bar mt8"><i style="width:${pc}%;background:var(--c)"></i></div></div><span class="tiny muted b">${st.done}/${st.total}</span><span class="chev ${op?'up':''}">›</span></button>${op?`<div class="body"><div class="micro">${t.subs.map((m,i)=>{const id=t.id+'.'+i,v=S.syl[id]||0;return `<button class="mc s${v}" data-act="mc" data-id="${id}" aria-label="${esc(m)}: ${STN[v]}"><span class="st">${v===3?'✓':''}</span>${esc(m)}</button>`}).join('')}</div><div class="row wrap mt12" style="gap:6px"><span class="tiny muted">Set all to</span>${[1,2,3].map(v=>`<button class="chip sm" data-act="tall" data-id="${t.id}" data-v="${v}">${STN[v]}</button>`).join('')}<button class="chip sm" data-act="tall" data-id="${t.id}" data-v="0">Reset</button></div><div class="row wrap mt12" style="gap:8px"><button class="btn sm pri" data-act="pomoTopic" data-id="${t.id}">${I.play}Study this now</button><button class="btn sm" data-act="logprac" data-id="${t.id}">+ Log practice</button>${r.sess?`<span class="tiny muted">${r.sess} session${r.sess>1?'s':''} logged${r.att?' · '+r.cor+'/'+r.att+' correct':''}</span>`:''}</div></div>`:''}</div>`}
function viewSyl(){const all=secStats(),f=S.ui.sylF||'all',sec=S.ui.sylSec||'qa',list=sylList(),R=topicPerf();
 let h=topBar('Syllabus',all.d+' of '+all.t+' practised · '+all.left+' to go');

 h+=`<div class="row wrap" style="gap:6px">${FL.map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="sylf" data-f="${k}">${l}</button>`).join('')}${list.length?`<button class="chip" data-act="expall">${list.every(t=>S.ui.open[t.id])?'Collapse all':'Expand all'}</button>`:''}</div>`;
 h+=`<div class="legend">${STN.map((nm,i)=>`<span class="mc s${i}" style="--c:var(--acc)"><span class="st">${i===3?'✓':''}</span>${nm}</span>`).join('')}</div><p class="tiny muted" style="margin:0 0 14px">Tap a micro-topic to move it forward. Learnt = concept clear · Practised = solved a set · Mastered = timed at ${S.setup.acc}%+ accuracy.${f==='weak'?' Weak = mock mistakes or practice accuracy below target.':''}</p>`;
 if(!list.length)h+=`<div class="card empty"><p class="muted small">${f==='weak'?'Nothing weak yet. Topics appear here when you log mock mistakes or practice accuracy falls below your target.':'Nothing left here. Great work.'}</p></div>`;

function mockCard(m,r,k,prev){const sE=S.setup.showEst;return `<button class="card mockc" data-act="mopen" data-id="${m.id}"><div class="row between top-a"><div class="grow"><div class="eyebrow">Mock ${k} · ${fmt(parse(m.date))}${m.diff?' · '+esc(m.diff):''}</div><div class="b" style="font-size:17px;margin-top:2px">${esc(m.name)}</div></div><div style="text-align:right"><div class="score">${r.tot}</div><div class="tiny muted mt4">${r.acc==null?'':Math.round(r.acc*100)+'% acc'}${prev?` · <span style="color:${r.tot>=prev.tot?'var(--green)':'var(--red)'};font-weight:700">${delta(r.tot-prev.tot)}</span>`:''}</div></div></div><div class="secbars">${SK.map(s=>`<div><div class="row between tiny"><span class="muted b">${SECS[s].name}</span><b>${r[s].sc}</b></div><div class="bar mt4"><i style="width:${clamp(r[s].sc/(S.setup.q[s]*3)*100,0,100)}%;background:${SECS[s].c}"></i></div></div>`).join('')}</div><div class="row between tiny"><span class="row" style="gap:8px"><span class="anadots">${PASSES.map((_,i)=>`<i class="${i<r.ana?'on':''}"></i>`).join('')}</span><b style="color:${r.ana===4?'var(--green)':'var(--orange)'}">${r.ana===4?'Analysed':'Analysis '+r.ana+'/4'}</b></span><span class="muted">${(m.errors||[]).length} mistakes${m.opct?' · %ile '+esc(m.opct):''}${sE?' · est '+pctLabel(est('tot',r.tot)):''}</span></div></button>`}
function viewMocks(){const ms=sortedAsc(),rs=ms.map(mockCalc),debt=rs.filter(r=>r.ana<4).length;
 let h=topBar('Mocks',ms.length+' taken · '+debt+' pending analysis');
 h+=`<button class="card addmock" data-act="madd"><span class="plus">${I.plus}</span><div><div class="b" style="font-size:17px">Log a mock</div><div class="tiny muted">About 40 seconds. Then analyse it in 4 passes.</div></div></button>`;
 if(!ms.length){const nm=nextMock(dayNo());return h+`<div class="card empty"><h2>No mocks yet</h2><p class="small muted">${nm?'Your next scheduled mock is on '+esc(fmtLong(nm))+'. ':''}Log each mock right after you finish it.</p></div>`}
 const tg=tScore('tot',S.setup.target);
 h+=`<div class="card"><div class="row between wrap"><h2>Score trend</h2><span class="tiny muted">dashed = target ~${Math.round(tg)} marks</span></div>${chart([{c:'var(--acc)',v:rs.map(r=>r.tot)}],ms.map((_,i)=>'M'+(i+1)),tg)}</div>`;
 return h+ms.map((m,i)=>({m,r:rs[i],k:i+1,p:i?rs[i-1]:null})).reverse().map(o=>mockCard(o.m,o.r,o.k,o.p)).join('')}

 efsec:el=>{EF.sec=el.dataset.k;EF.topic='';renderSheet()},
 eftype:el=>{EF.type=el.dataset.k;renderSheet()},
 eadd:el=>{const m=getM(el.dataset.id);if(!m)return;const sl=$('#efTopic'),topic=sl?sl.value:EF.topic,note=(($('#efNote')||{}).value||'').trim();if(!TP[topic])return;const rc=repeatCount(topic,EF.type,m.id),ty=ETYPES.find(x=>x.id===EF.type);
  m.errors=m.errors||[];m.errors.push({id:uid(),sec:EF.sec,topic,type:EF.type,note});EF.topic=topic;EF.note='';commit();renderSheet();toast(rc.c?'Repeat mistake — '+ordinal(rc.c+1)+' time: '+TP[topic].name+' · '+ty.name:'Logged · '+TP[topic].name)},
 edel:el=>{const m=getM(el.dataset.m);if(!m)return;m.errors=(m.errors||[]).filter(e=>e.id!==el.dataset.e);commit();renderSheet()},
 setlen:el=>{const f=el.closest('form');f.querySelector('[name=exam]').value=dkey(addDays(formStart(f),+el.dataset.v));updPlanInfo(f)},
 setfound:el=>{const f=el.closest('form'),v=+el.dataset.v;f.querySelector('[name=foundEnd]').value=v?dkey(addDays(formStart(f),v-1)):'';updPlanInfo(f)},
 /* ---- pomodoro ---- */
 pomoOpen:()=>openSheet('pomo'),
 pomoTopic:el=>{const t=TP[el.dataset.id];if(!t)return;const p=ps();if(timing()){openSheet('pomo');toast('A session is already running');return}Object.assign(p,{phase:'idle',sec:t.sec,topic:t.id});Kit.save(S);openSheet('pomo')},
 pomoSec:el=>{const p=ps();p.sec=el.dataset.k;p.topic='';Kit.save(S);renderSheet()},
 pomoDur:el=>{pp().dur=+el.dataset.v;Kit.save(S);renderSheet()},
 pomoBrk:el=>{pp().brk=+el.dataset.v;Kit.save(S);renderSheet()},
 pomoGoal:el=>{pp().goal=+el.dataset.v;commit();renderSheet()},
 pomoSound:()=>{pp().sound=!pp().sound;Kit.save(S);renderSheet();if(pp().sound)beep()},
 pomoTimed:()=>{const p=ps();p.timed=!p.timed;Kit.save(S);renderSheet()},
 pomoStart:()=>{const p=ps(),pr=pp(),ms=pr.dur*60000;Object.assign(p,{phase:'focus',total:ms,endsAt:Date.now()+ms,left:0,running:true,sec:p.sec||'qa',logText:null,att:'',cor:'',date:'',timed:false,mins:0});ARM=null;commit();reSheet();toast(pr.dur+'-minute session started')},
 pomoPause:()=>{const p=ps();if(p.running){p.left=pLeft();p.running=false}commit();reSheet()},
 pomoResume:()=>{const p=ps();if(!p.running){p.endsAt=Date.now()+(p.left||0);p.running=true}commit();reSheet()},
 pomoPlus5:()=>{const p=ps();if(p.running)p.endsAt+=300000;else p.left=(p.left||0)+300000;p.total+=300000;commit();reSheet()},
 pomoFinish:()=>{const p=ps(),done=p.total-pLeft();if(done<60000){Object.assign(p,freshPomo(),{sec:p.sec,topic:p.topic,text:p.text});commit();reSheet();toast('Under a minute, so it wasn’t logged');return}
  Object.assign(p,{phase:'log',running:false,left:0,mins:Math.round(done/60000),logText:p.text||'',date:TODAY()});commit();reSheet()},
 pomoDiscard:()=>{if(ARM!=='pd'){ARM='pd';renderSheet();return}const p=ps();Object.assign(p,freshPomo(),{sec:p.sec,topic:p.topic,text:p.text});ARM=null;commit();reSheet();toast('Session discarded')},
 pomoSave:el=>{const p=ps(),pt=ptOf(el),mins=clamp(parseInt(($('#plMins')||{}).value)||p.mins||1,1,600),dk=(($('#plDate')||{}).value)||TODAY(),text=(($('#plText')||{}).value||'').trim(),att=Math.max(0,parseInt(($('#plAtt')||{}).value)||0),cor=Math.min(Math.max(0,parseInt(($('#plCor')||{}).value)||0),att);
  const d=ensureDay(dk);d.items.push({id:uid(),sec:p.sec||'qa',topic:p.topic||'',text:text||(p.topic?'':'Study session'),att:att||'',cor:att?cor:'',timed:!!p.timed,mins,pomo:true});
  d.hrs=String(Math.round(((+d.hrs||0)+mins/60)*4)/4);S.focusMin=(S.focusMin||0)+mins;
  Object.assign(p,{phase:'post',running:false,left:0,logText:null,att:'',cor:'',date:'',timed:false,mins:0});commit();reSheet();toast('Session added to '+(dk===TODAY()?'today':fmt(parse(dk))));celebrate(pt)},
 pomoBreak:()=>{const p=ps(),ms=pp().brk*60000;Object.assign(p,{phase:'break',total:ms,endsAt:Date.now()+ms,left:0,running:true});commit();reSheet()},
 pomoIdle:()=>{const p=ps();Object.assign(p,{phase:'idle',running:false,left:0});commit();reSheet()},
 pomoDone:()=>{const p=ps();Object.assign(p,{phase:'idle',running:false,left:0});commit();closeSheet()},
 /* ---- data ---- */
 exp:()=>{Kit.backupNow().then(ok=>{if(ok){render();reSheet()}})},
 copy:async()=>{await Kit.flush();const d=JSON.stringify(Kit.backupObject());if(await copyText(d)){Kit.markBackedUp();toast('Backup text copied. Paste it somewhere safe.')}else{const ta=$('#impTxt');if(ta){ta.value=d;ta.focus();ta.select()}toast('Select all and copy')}},
 imp:()=>{const v=(($('#impTxt')||{}).value||'').trim();if(!v){toast('Paste a backup first');return}try{PENDING=parseAny(v);renderSheet()}catch(e){toast(e.message)}},
 rfile:()=>$('#restoreInput').click(),
 rsnap:async()=>{const s=await Kit.latestSnapshot();if(!s){toast('No recovery copy yet');return}const d=migrate(s.state);PENDING={kind:'snapshot',data:d,summary:TOOL.summary(d),exportedAt:new Date(s.at).toISOString()};renderSheet()},
 rconfirm:()=>{applyPending()},
 rcancel:()=>{PENDING=null;renderSheet()},
 persist:()=>{Kit.askPersist().then(reSheet)},
 fchoose:()=>{Kit.file.choose().then(reSheet)},
 fresume:()=>{Kit.file.resume().then(()=>{render();reSheet()})},
 fstop:()=>{Kit.file.stop().then(reSheet)},
 reset:async()=>{if(ARM!=='reset'){ARM='reset';renderSheet();return}await Kit.snapshot('before-reset');S=fresh();closeSheet();commit();toast('All data erased. A recovery copy was kept.')}
};

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=ACT[el.dataset.act];if(a){e.preventDefault();a(el,e)}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();if(f.id==='mockForm')saveMockForm(f);else if(f.id==='setupForm'||f.id==='setForm')savePlan(f)});
function onField(e){const t=e.target;if(t.closest('#mockForm'))updPrev();const pf=t.closest('#setupForm,#setForm');if(pf)updPlanInfo(pf);if(t.id==='efNote')EF.note=t.value;if(t.id==='dfAtt')DF.att=t.value;if(t.id==='dfCor')DF.cor=t.value;if(t.id==='dfText')DF.text=t.value;
 const p=ps();if(t.id==='pomoText'){p.text=t.value;Kit.save(S)}if(t.id==='plText'){p.logText=t.value;Kit.save(S)}if(t.id==='plAtt'){p.att=t.value;Kit.save(S)}if(t.id==='plCor'){p.cor=t.value;Kit.save(S)}if(t.id==='plMins'){p.mins=t.value;Kit.save(S)}}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset&&t.dataset.set){Kit.settings[t.dataset.set]=t.value;Kit.saveSettings();render();return}
 if(t.dataset&&t.dataset.me){S.me[t.dataset.me]=String(t.value||'').trim();commit();if(t.dataset.me!=='avatar')toast('Saved');return}
 onField(e);if(t.id==='efTopic')EF.topic=t.value;if(t.id==='dfTopic'){DF.topic=t.value;reSheet()}
 if(t.id==='pomoTopic'){ps().topic=t.value;Kit.save(S)}
 if(t.id==='pomoDurC'){const v=clamp(parseInt(t.value)||25,5,180);pp().dur=v;Kit.save(S);renderSheet()}
 if(t.id==='plDate'){ps().date=t.value;Kit.save(S);renderSheet()}
 if(t.dataset&&t.dataset.take){const m=getM(t.dataset.take);if(m){m.take=t.value;commit();toast('Saved')}}
 if(t.dataset&&t.dataset.dayhrs){ensureDay(t.dataset.dayhrs).hrs=t.value;commit()}
 if(t.dataset&&t.dataset.daynote){ensureDay(t.dataset.daynote).note=t.value;commit();toast('Saved')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEET)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pomoTick()});
$('#restoreInput').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;try{PENDING=parseAny(await f.text());if(!SHEET||SHEET.type!=='settings')openSheet('settings',null,{scroll:'dataCard'});else renderSheet()}catch(err){toast(err.message)}});

/* ================= BOOT ================= */
(async function init(){const fb=setTimeout(()=>{if(!touched)render()},3000);
 try{await Kit.init(TOOL);const r=await Kit.load();
  if(r.state){S=migrate(r.state)||fresh();if(r.source==='snapshot'){RECOV=r.snapAt;Kit.save(S)}}
  else{const leg=await legacyLoad();if(leg){S=leg;Kit.save(S);setTimeout(()=>toast('Imported your Sprint99 data'),600)}}
  const T0=dkey(new Date()),last=Kit.meta.lastOpened;if(last&&last<T0&&S.setup)WB={gap:diffDays(parse(last),parse(T0))};Kit.meta.lastOpened=T0;Kit.saveMeta();
  if(S.setup&&!(Kit.meta.snaps||[]).length)Kit.snapshot('first');else if(S.setup&&Date.now()-(Kit.status.snapAt||0)>36e5)Kit.snapshot('daily',S);
 }catch(e){console.error(e)}
 clearTimeout(fb);CNT=true;ANIM=true;render();pomoTick()})();
})();
</script>
</body>
</html>
