<html lang="en">
<head>
<meta charset="UTF-8">

<title>Sprint99 · CAT Prep Tracker</title>
<style>
:root{
 --bg:#f2f2f7;--card:#fff;--card2:#f7f7fa;--ink:#000;--ink2:#3c3c43;--muted:#8a8a8e;--line:rgba(60,60,67,.12);--fill:rgba(120,120,128,.14);--fill2:rgba(120,120,128,.08);
 --blue:#007aff;--indigo:#5856d6;--purple:#af52de;--pink:#ff2d55;--red:#ff3b30;--orange:#ff9500;--yellow:#ffcc00;--green:#34c759;--teal:#30b0c7;--mint:#00c7be;--gray:#8e8e93;
 --brand:var(--indigo);--qa:var(--blue);--dilr:var(--orange);--varc:var(--purple);--good:var(--green);--warn:var(--orange);--bad:var(--red);
 --r:22px;--sh:0 1px 1px rgba(0,0,0,.02),0 10px 30px rgba(25,25,80,.06);
 --ph-f:#f1e7fb;--ph-p:#ddf5f2;--ph-t:#fff0da;--ph-e:#ffe2e8;
 --hero:linear-gradient(135deg,#5856d6 0%,#af52de 55%,#ff2d55 100%);
}
[data-theme=dark]{
 --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--ink:#fff;--ink2:#ebebf5;--muted:#8e8e93;--line:rgba(84,84,88,.6);--fill:rgba(118,118,128,.26);--fill2:rgba(118,118,128,.16);
 --blue:#0a84ff;--indigo:#5e5ce6;--purple:#bf5af2;--pink:#ff375f;--red:#ff453a;--orange:#ff9f0a;--yellow:#ffd60a;--green:#30d158;--teal:#40c8e0;--mint:#63e6e2;--gray:#98989d;
 --sh:none;--ph-f:#2e2142;--ph-p:#0f312d;--ph-t:#3b2a10;--ph-e:#3e1522;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;letter-spacing:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--fill2);border:1px solid transparent;border-radius:12px;padding:11px 13px;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{background:var(--card);border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 18%,transparent)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
label{display:block;font-size:13px;color:var(--muted);font-weight:600}
label>input,label>select,label>textarea{margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 6px;text-align:right;border-bottom:.5px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.neg{color:var(--red);font-weight:700}
#app{display:flex;min-height:100vh}
.side{display:none}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
@media(max-width:899px){#main{padding-top:calc(10px + env(safe-area-inset-top,0px))}}
nav.mtabs{top:env(safe-area-inset-top,0px)}
main{flex:1;min-width:0;padding:10px 16px 40px;max-width:1040px;margin:0 auto}
@media(min-width:900px){
 .side{display:flex;flex-direction:column;gap:2px;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:24px 14px;background:color-mix(in srgb,var(--card) 70%,var(--bg));border-right:.5px solid var(--line)}
 main{padding:34px 40px 60px}
 .mtabs{display:none!important}.ib.mob{display:none}
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.03em;padding:4px 10px 22px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--hero);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;box-shadow:0 6px 16px color-mix(in srgb,var(--purple) 40%,transparent)}
.sb{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;font-weight:600;font-size:15px;color:var(--ink);width:100%;text-align:left;transition:.15s}
.sb:hover{background:var(--fill2)}.sb.on{background:var(--card);box-shadow:var(--sh)}
[data-theme=dark] .sb.on{background:var(--card2)}
.tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--tc);color:#fff;flex:none;box-shadow:inset 0 -8px 12px rgba(0,0,0,.08)}
.tile svg,.kt svg,.mt svg,.ib svg,.plus svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--muted)}
.mtabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:8px 16px 10px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mt{display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 10px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink);background:var(--card);white-space:nowrap;flex:none;box-shadow:var(--sh)}
.mt svg{color:var(--tc)}
.mt.on{background:var(--tc);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--tc) 35%,transparent)}.mt.on svg{color:#fff}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
h1{font-size:32px;line-height:1.12;margin:2px 0 0;letter-spacing:-.035em;font-weight:800}
h2{font-size:19px;margin:0;letter-spacing:-.025em;font-weight:700}h3{font-size:16px;margin:0;font-weight:700;letter-spacing:-.02em}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--blue);flex:none;box-shadow:var(--sh);font-size:15px;font-weight:600}
.ib.sm{width:30px;height:30px;font-size:12px;background:var(--fill);color:var(--muted);box-shadow:none}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}.top-a{align-items:flex-start}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
@media(min-width:680px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.cards{margin-bottom:16px}.cards>.card{margin:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}.b{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 30%,transparent)}
.btn.sm{padding:7px 14px;font-size:14px}.btn.w{width:100%}
.btn.ok{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.btn.danger{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 15px;background:var(--fill2);font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.15s}
.chip.sm{padding:5px 12px;font-size:13px}
.chip.on,.chip:has(input:checked){background:var(--cc,var(--indigo));color:#fff}
.chip input{display:none}
.bar{height:8px;background:var(--fill);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;margin-right:7px;vertical-align:1px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill2);color:var(--muted);white-space:nowrap}
.badge.H{background:color-mix(in srgb,var(--pink) 14%,transparent);color:var(--pink)}.badge.M{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}
.badge.err{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}.badge.okb{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.kpi{margin:0;padding:16px}
.kt{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--kc);color:#fff;margin-bottom:12px;box-shadow:0 4px 12px color-mix(in srgb,var(--kc) 35%,transparent)}
.kpi .l{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-top:2px}
.ring{--s:54px;width:var(--s);height:var(--s);border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--c) 16%,transparent) 0);display:grid;place-items:center;flex:none}
.ring>span{width:calc(var(--s) - 12px);height:calc(var(--s) - 12px);border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:800}
.hero{background:var(--hero);color:#fff;position:relative;overflow:hidden;padding:22px;box-shadow:0 16px 40px color-mix(in srgb,var(--purple) 32%,transparent)}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);top:-110px;right:-70px}
.hero::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,204,0,.25),transparent 70%);bottom:-100px;left:-50px}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{color:rgba(255,255,255,.82)}
.huge{font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1}
.glass{background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:10px 14px;text-align:right;font-weight:700;font-size:13px;line-height:1.3}
.glass b{display:block;font-size:24px;letter-spacing:-.03em}
.tline{position:relative;display:flex;gap:3px;height:28px;margin-top:18px}
.tline .seg{border-radius:8px;color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;padding:0 9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.seg.f{background:var(--purple)}.seg.p{background:var(--teal)}.seg.t{background:var(--orange)}
.hero .seg{background:rgba(255,255,255,.2)!important}.hero .seg.p{background:rgba(255,255,255,.32)!important}
.tline .mark{position:absolute;top:-5px;bottom:-5px;width:4px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}
.hero .tline .mark{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.hero .muted{color:rgba(255,255,255,.8)}
.cb{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--gray) 55%,transparent);flex:none;display:grid;place-items:center;color:#fff;transition:.2s}
.cb.on{background:var(--green);border-color:var(--green);box-shadow:0 3px 10px color-mix(in srgb,var(--green) 35%,transparent)}
.frow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:.5px solid var(--line)}.frow.first{border-top:0}
.act{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-top:.5px solid var(--line)}.act.first{border-top:0}
.an{width:28px;height:28px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;color:var(--ink2)}
.act.first .an{background:var(--hero);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--purple) 35%,transparent)}
.stage{font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;color:var(--sc);background:color-mix(in srgb,var(--sc) 15%,transparent);white-space:nowrap}
.ladder{display:inline-flex;gap:3px}.ladder i{width:12px;height:5px;border-radius:3px;background:var(--fill);display:block}.ladder i.on{background:var(--sc)}
.ready{display:grid;grid-template-columns:1fr;gap:6px;align-items:center}
@media(min-width:680px){.ready{grid-template-columns:170px 1fr;gap:18px}}
.rwrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}
.rings{width:136px;height:136px}
.rleg{display:flex;gap:12px;font-size:12.5px;font-weight:700}
.warn{background:color-mix(in srgb,var(--orange) 12%,var(--card))}
.note{padding:13px 15px;border-radius:14px;background:var(--fill2);font-size:14px;line-height:1.5}
.tip{background:linear-gradient(135deg,color-mix(in srgb,var(--yellow) 30%,var(--card)),color-mix(in srgb,var(--orange) 16%,var(--card)))}
.ichip{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--fill2)}
.mrow{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,var(--blue) 9%,transparent)}
.sectabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sectab{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;text-align:center;margin:0;width:100%;transition:.15s}
.sectab.on{box-shadow:0 0 0 2.5px var(--c),var(--sh)}
@media(min-width:680px){.sectab{flex-direction:row;text-align:left;padding:16px 18px}}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 8px}.legend .mc{padding:4px 10px;font-size:12.5px;cursor:default}
.topic{padding:0;overflow:hidden}.thead{display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;text-align:left}.topic .body{padding:0 18px 18px}
.chev{transition:transform .2s;color:var(--gray);font-size:24px;line-height:1;width:14px;text-align:center}.chev.up{transform:rotate(90deg)}
.micro{display:flex;flex-wrap:wrap;gap:8px}
.mc{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 13px 8px 9px;font-size:14px;background:var(--fill2);color:var(--ink2);text-align:left;line-height:1.25;transition:.15s}
.mc .st{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--c);flex:none;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:900}
.mc.s1 .st{background:conic-gradient(var(--c) 0 33%,transparent 33%)}.mc.s2 .st{background:conic-gradient(var(--c) 0 67%,transparent 67%)}.mc.s3 .st{background:var(--c)}
.mc.s2{background:color-mix(in srgb,var(--c) 10%,transparent)}.mc.s3{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink);font-weight:600}
.mockc{display:block;width:100%;text-align:left;transition:transform .1s}.mockc:active{transform:scale(.99)}
.score{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1}
.secbars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0 12px}
.anadots{display:inline-flex;gap:3px}.anadots i{width:10px;height:10px;border-radius:50%;background:var(--fill);display:block}.anadots i.on{background:var(--green)}
.addmock{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 14%,var(--card)),var(--card))}
.plus{width:44px;height:44px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 35%,transparent)}
.plus svg{width:22px;height:22px}
.chart{width:100%;height:auto;display:block;margin-top:12px}.chart .gl{stroke:var(--line)}.chart .ax{fill:var(--muted);font-size:11px}.chart .tgt{stroke:var(--pink);stroke-dasharray:6 5;stroke-width:1.6}.chart .zl{stroke:var(--gray);stroke-width:1}
.hb{margin-bottom:12px}.hb .bar>i{background:linear-gradient(90deg,var(--orange),var(--pink))}
ul.pb{margin:12px 0 0;padding-left:20px}ul.pb li{margin:8px 0;color:var(--ink2);font-size:15px}
.tw{overflow-x:auto}
.seg2{display:inline-flex;background:var(--fill);border-radius:11px;padding:2px;gap:0}
.seg2 button{padding:7px 18px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink);transition:.2s}
.seg2 button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
[data-theme=dark] .seg2 button.on{background:#636366}
.legend2{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.sw{width:14px;height:14px;border-radius:5px;display:inline-block;vertical-align:-2px;margin-right:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px;text-transform:uppercase}
.cd{position:relative;min-height:56px;border-radius:12px;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:var(--ink);transition:transform .1s}
button.cd:active{transform:scale(.95)}
.cd .dn{font-size:14px;font-weight:700}
.cd.off{color:var(--muted);opacity:.35}
.cd.ph-found{background:var(--ph-f)}.cd.ph-prep{background:var(--ph-p)}.cd.ph-taper{background:var(--ph-t)}.cd.ph-exam{background:var(--hero);color:#fff}
.cd.today{box-shadow:inset 0 0 0 2.5px var(--indigo)}
.cd .ck{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:50%;background:var(--green);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center}
.cd .cf{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.cd.done .dn{color:var(--muted)}
.mk{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue);line-height:1.3;white-space:nowrap;display:inline-block}
.mk.done{background:var(--blue);color:#fff}.mk.ex{background:rgba(255,255,255,.28);color:#fff}

@media(min-width:680px){.cd{min-height:72px;padding:8px 9px}.cal{gap:7px}}
.lrow{display:flex;gap:12px;align-items:center;border-top:.5px solid var(--line)}.lrow.first{border-top:0}
.lrow.today{background:color-mix(in srgb,var(--indigo) 8%,transparent);border-radius:12px}
.phbar{width:5px;align-self:stretch;border-radius:4px;flex:none;margin:7px 0}

.lbtn{text-align:left;padding:11px 0}

.addbox{padding:14px;border-radius:16px;background:var(--fill2)}.addbox select,.addbox input{background:var(--card)}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.38);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet-card{position:relative;width:100%;max-width:680px;max-height:93vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(28px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.25,1)}
.sheet-card::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 12px}

};
function storeText(){return backend==='cloud'?'Your progress saves automatically with this app in your Claude account.':backend==='local'?'Your progress saves automatically in this browser on this device. Use a backup to move it to another device.':'Storage isn’t available here, so data lasts only for this session. Download a backup before closing.'}
function commit(){touched=true;render();clearTimeout(saveT);saveT=setTimeout(()=>Store.save(),700)}
let tT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('show'),2200)}
function ensureDay(dk){if(!S.days[dk])S.days[dk]={done:false,items:[],note:'',hrs:''};if(!Array.isArray(S.days[dk].items))S.days[dk].items=[];return S.days[dk]}

/* ================= PLAN ENGINE ================= */
function P(s){s=s||S.setup;const st=parse(s.start),ex=parse(s.exam),L=Math.max(1,diffDays(st,ex));let F=0;if(s.foundEnd)F=clamp(diffDays(st,parse(s.foundEnd))+1,0,L);const TPd=clamp(+s.taper||0,0,Math.max(0,L-F));return {st,ex,L,F,TPd,pe:L-TPd}}
function phaseN(n,p){p=p||P();if(n<1)return 'pre';if(n<=p.F)return 'found';if(n<=p.pe)return 'prep';if(n<=p.L)return 'taper';if(n===p.L+1)return 'exam';return 'post'}
function dateOfDay(n){return addDays(P().st,n-1)}
function dayNo(d){return diffDays(P().st,d||new Date())+1}
function autoMock(n,s){s=s||S.setup;const p=P(s),m=s.mock||{};if(n<=p.F||n>p.pe)return false;const d=n-p.F;if(m.type==='every')return (d-1)%Math.max(1,+m.n||1)===0;if(m.type==='weekly'){const wd=(addDays(p.st,n-1).getDay()+6)%7;return (m.days||[]).indexOf(wd)>=0}return false}
function isMock(n){if(n<1||n>P().L)return false;const ov=S.mockOv[dkey(dateOfDay(n))];if(ov===true||ov===false)return ov;return autoMock(n)}
function mockNoOf(n){let c=0;for(let i=1;i<=n;i++)if(isMock(i))c++;return c}
function countAuto(s){const p=P(s);let c=0;for(let i=1;i<=p.L;i++)if(autoMock(i,s))c++;return c}
function nextMock(n0){const p=P();for(let i=Math.max(n0,1);i<=p.L;i++)if(isMock(i))return dateOfDay(i);return null}
function mockRule(s){const m=s.mock||{};if(m.type==='every')return +m.n===1?'every day':'every '+m.n+' days';if(m.type==='weekly')return (m.days||[]).slice().sort().map(i=>WD[i]).join(', ')||'no weekdays';return 'dates you pick'}
function streak(){let d=new Date(),c=0;if(!(S.days[dkey(d)]&&S.days[dkey(d)].done))d=addDays(d,-1);while(S.days[dkey(d)]&&S.days[dkey(d)].done){c++;d=addDays(d,-1)}return c}

/* ================= METRICS ================= */
function topicStats(t){const v=t.subs.map((_,i)=>S.syl[t.id+'.'+i]||0);return {avg:avg(v),learn:v.filter(x=>x>=1).length,done:v.filter(x=>x>=2).length,mast:v.filter(x=>x===3).length,total:v.length}}
function secStats(sec){let t=0,l=0,d=0,m=0;ALLT.filter(x=>!sec||x.sec===sec).forEach(tp=>tp.subs.forEach((_,i)=>{const v=S.syl[tp.id+'.'+i]||0;t++;if(v>=1)l++;if(v>=2)d++;if(v===3)m++}));return {t,l,d,m,left:t-d,pct:t?Math.round(d/t*100):0,lpct:t?Math.round(l/t*100):0}}
function secScore(x){x=x||{};const att=+x.att||0,cor=Math.min(+x.cor||0,att),tw=Math.min(+x.tw||0,att-cor),wr=att-cor,pen=wr-tw,sc=3*cor-pen;return {att,cor,wr,pen,sc,acc:att?cor/att:null}}
function mockCalc(m){const r={tot:0,att:0,cor:0};SK.forEach(k=>{r[k]=secScore(m.sec&&m.sec[k]);r.tot+=r[k].sc;r.att+=r[k].att;r.cor+=r[k].cor});r.acc=r.att?r.cor/r.att:null;r.ana=PASSES.filter(p=>m.ana&&m.ana[p.id]).length;return r}
function sortedAsc(){return S.mocks.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0))}
function getM(id){return S.mocks.find(m=>m.id===id)}
function topicPerf(){const R={};ALLT.forEach(t=>{R[t.id]={e:0,mocks:new Set(),types:{},recent:0,att:0,cor:0,sess:0}});const ms=sortedAsc(),rec=new Set(ms.slice(-3).map(m=>m.id));
 ms.forEach(m=>(m.errors||[]).forEach(e=>{const r=R[e.topic];if(!r)return;r.e++;r.mocks.add(m.id);r.types[e.type]=(r.types[e.type]||0)+1;if(rec.has(m.id))r.recent++}));
 Object.keys(S.days).forEach(k=>(S.days[k].items||[]).forEach(it=>{const r=R[it.topic];if(!r)return;r.sess++;const a=+it.att||0;if(a){r.att+=a;r.cor+=Math.min(+it.cor||0,a)}}));return R}
function repeatCount(topic,type,exceptId){let c=0;const mk=new Set();S.mocks.forEach(m=>{if(m.id===exceptId)return;(m.errors||[]).forEach(e=>{if(e.topic===topic&&e.type===type){c++;mk.add(m.id)}})});return {c,m:mk.size}}
function recurring(){const map={};sortedAsc().forEach(m=>(m.errors||[]).forEach(e=>{const k=e.topic+'|'+e.type;if(!map[k])map[k]={topic:e.topic,type:e.type,c:0,mocks:new Set()};map[k].c++;map[k].mocks.add(m.id)}));return Object.values(map).filter(x=>x.mocks.size>=2).sort((a,b)=>b.mocks.size-a.mocks.size||b.c-a.c)}
function actionsFor(){const R=topicPerf(),ta=S.setup.acc/100,ph=phaseN(dayNo());
 return ALLT.map(t=>{const r=R[t.id],st=topicStats(t),acc=r.att>=5?r.cor/r.att:null,why=[];let sc=WV[t.w]*(1-st.avg/3)*(ph==='found'?1.4:1);
  if(r.e){sc+=r.e*1.1+r.recent*.8+(r.mocks.size>=2?1.5:0);why.push(r.e+' mistake'+(r.e>1?'s':'')+(r.mocks.size>1?' across '+r.mocks.size+' mocks':' in 1 mock'))}
  if(acc!=null){if(acc<ta)sc+=(ta-acc)*8;why.push('Practice accuracy '+Math.round(acc*100)+'%')}
  why.push(WN[t.w]+' weightage');why.push('Status: '+STN[Math.round(st.avg)]);
  const dom=Object.keys(r.types).sort((a,b)=>r.types[b]-r.types[a])[0];let act;
  if(st.avg<1&&!r.e)act='Learn the basics + 10 easy questions';
  else if(dom==='concept')act='Relearn the concept + 15 fresh questions';
  else if(dom==='silly'||dom==='misread')act='Accuracy drill: 10 questions, verify every final step';
  else if(dom==='time'||dom==='select'||dom==='missed'||dom==='guess')act='Speed set: 10 questions in 20 min with hard exits';
  else if(acc!=null&&acc<ta)act='Practice set of 15 — aim for '+S.setup.acc+'%+';
  else if(st.avg<2)act='Practice set of 15 questions';
  else act='Timed mixed set to confirm mastery';
  return {t,sc,why,act,r,acc,st}}).sort((a,b)=>b.sc-a.sc)}
function nextActions(){const out=[],n0=dayNo(),p=P(),ms=sortedAsc();
 const debt=ms.filter(m=>mockCalc(m).ana<4);
 if(debt.length){const m=debt[debt.length-1],pend=PASSES.filter(x=>!(m.ana&&m.ana[x.id])).map(x=>x.s);out.push({label:'Analysis debt',col:'var(--orange)',title:'Finish analysing '+m.name,sub:'Pending: '+pend.join(', ')+'.',why:debt.length>1?[(debt.length-1)+' more mock'+(debt.length>2?'s':'')+' waiting']:null,btn:['Analyse','mopen',m.id]})}
 if(n0>=1&&n0<=p.L&&isMock(n0)){const dk=dkey(new Date());if(!S.mocks.some(m=>m.date===dk))out.push({label:'Mock day',col:'var(--blue)',title:'Take Mock #'+mockNoOf(n0),sub:'Full 120 minutes at your exam-slot time. Log it right after.',btn:['Log','madd',dk]})}
 const ranked=actionsFor(),tp=ranked[0];
 if(tp){const fresh0=!tp.r.e&&tp.acc==null;out.push({label:fresh0?'Suggested next · your call':'Highest-value repair',col:SECS[tp.t.sec].c,title:tp.t.name,sub:tp.act,why:tp.why,btn:['Open','opentopic',tp.t.id]});
  ORDER.forEach(sec=>{if(sec===tp.t.sec)return;const r=ranked.find(x=>x.t.sec===sec);if(r)out.push({label:SECS[sec].name,col:SECS[sec].c,title:r.t.name,sub:r.act,why:r.why,btn:['Open','opentopic',r.t.id]})})}
 return out}
function readiness(sec){const x=secStats(sec),ms=sortedAsc().slice(-3).map(mockCalc),tgt=tScore(sec,S.setup.target);
 if(x.lpct<50)return {stage:'Foundation',why:x.lpct+'% of micro-topics learnt'};
 if(x.pct<50||!ms.length)return {stage:'Building',why:x.pct+'% practised'+(ms.length?'':' · no mocks yet')};
 const al=ms.map(r=>r[sec].acc).filter(v=>v!=null),acc=al.length?avg(al):null,sc=avg(ms.map(r=>r[sec].sc)),mn=Math.min(...ms.map(r=>r[sec].sc));
 if(ms.length>=3&&acc!=null&&acc>=S.setup.acc/100&&sc>=tgt&&mn>=tgt*.8)return {stage:'Stable',why:'Last 3 mocks avg '+Math.round(sc)+' (target '+Math.round(tgt)+'), accuracy '+Math.round(acc*100)+'%'};
 return {stage:'Practising',why:'Last '+ms.length+' mock'+(ms.length>1?'s':'')+' avg '+Math.round(sc)+' vs target '+Math.round(tgt)+(acc!=null?' · accuracy '+Math.round(acc*100)+'%':'')}}
function itemName(it){return it.topic&&TP[it.topic]?TP[it.topic].name:(it.text||'Study session')}

function kpi(l,v,s,c,ic){return `<div class="card kpi"><div class="kt" style="--kc:${c}">${ic}</div><div class="l">${l}</div><div class="v">${v}</div><div class="tiny muted">${s}</div></div>`}
function stat(l,v,s){return `<div><div class="tiny muted b">${l}</div><div class="b" style="font-size:21px;letter-spacing:-.03em">${v}</div><div class="tiny muted">${s||''}</div></div>`}
function timeline(n,p){const M=p.pe-p.F,pos=clamp((n-.5)/p.L,0,1)*100;return `<div class="tline">${p.F?`<div class="seg f" style="flex:${p.F}">Foundation</div>`:''}${M?`<div class="seg p" style="flex:${M}">Preparation + mocks</div>`:''}${p.TPd?`<div class="seg t" style="flex:${p.TPd}">Taper</div>`:''}${n>=1&&n<=p.L?`<div class="mark" style="left:${pos}%"></div>`:''}</div>`}
function secLegend(){return `<div class="row wrap tiny muted mt8" style="gap:14px;font-weight:600">${SK.map(k=>`<span><span class="dot" style="background:${SECS[k].c}"></span>${SECS[k].name}</span>`).join('')}</div>`}
function itemChip(it){return `<span class="ichip"><span class="dot" style="background:${SECS[it.sec]?SECS[it.sec].c:'var(--gray)'}"></span>${esc(itemName(it))}${it.att?` · ${it.cor||0}/${it.att}`:''}</span>`}
function rings(){const size=136,sw=14,gap=4;let g='';ORDER.forEach((k,i)=>{const pc=secStats(k).pct,r=size/2-sw/2-i*(sw+gap),C=2*Math.PI*r,off=C*(1-clamp(pc,0,100)/100);g+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:${SECS[k].c};opacity:.16" stroke-width="${sw}"/>${pc>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:${SECS[k].c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>`:''}`});return `<svg viewBox="0 0 ${size} ${size}" class="rings" role="img" aria-label="Micro-topics practised by section">${g}</svg>`}
function chart(series,labels,target,H){H=H||200;const W=640,Pd={l:36,r:12,t:14,b:24};const vals=series.flatMap(s=>s.v.filter(x=>x!=null&&!isNaN(x)));if(target!=null)vals.push(target);if(!vals.length)return '';
 let mn=Math.min(0,...vals),mx=Math.max(...vals);if(mx===mn)mx=mn+10;const pd=(mx-mn)*.12;mx+=pd;if(mn<0)mn-=pd;
 const n=Math.max(...series.map(s=>s.v.length)),iw=W-Pd.l-Pd.r,ih=H-Pd.t-Pd.b,X=i=>Pd.l+(n<=1?iw/2:i*iw/(n-1)),Y=v=>Pd.t+ih*(1-(v-mn)/(mx-mn));
 let g='',defs='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);g+=`<line x1="${Pd.l}" x2="${W-Pd.r}" y1="${y}" y2="${y}" class="gl"/><text x="${Pd.l-7}" y="${y+4}" class="ax" text-anchor="end">${Math.round(v)}</text>`}
 if(mn<0){const y=Y(0);g+=`<line x1="${Pd.l}" x2="${W-Pd.r}" y1="${y}" y2="${y}" class="zl"/>`}
 if(target!=null){const y=Y(target);g+=`<line x1="${Pd.l}" x2="${W-Pd.r}" y1="${y}" y2="${y}" class="tgt"/>`}
 const step=Math.ceil(n/8);labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${X(i)}" y="${H-6}" class="ax" text-anchor="middle">${esc(l)}</text>`});
 series.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
  if(series.length===1&&pts.length>1){const gid='cg'+(++CG),base=Y(Math.max(mn,0));defs+=`<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${s.c};stop-opacity:.32"/><stop offset="1" style="stop-color:${s.c};stop-opacity:0"/></linearGradient>`;g+=`<path d="M${pts[0][0]},${base} L${pts.map(q=>q.join(',')).join(' L')} L${pts[pts.length-1][0]},${base} Z" fill="url(#${gid})"/>`}
  if(pts.length>1)g+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" style="fill:none;stroke:${s.c};stroke-width:3;stroke-linejoin:round;stroke-linecap:round"/>`;
  pts.forEach(q=>{g+=`<circle cx="${q[0]}" cy="${q[1]}" r="4.5" style="fill:var(--card);stroke:${s.c};stroke-width:2.5"/>`})});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart"><defs>${defs}</defs>${g}</svg>`}
function actionRow(a,i){const b=a.btn;return `<div class="act ${i===0?'first':''}"><div class="an">${i+1}</div><div class="grow"><div class="eyebrow" style="color:${a.col||'var(--muted)'}">${esc(a.label)}</div><div class="b" style="font-size:17px;margin-top:2px">${esc(a.title)}</div><div class="small mt4">${esc(a.sub)}</div>${a.why?`<div class="tiny muted mt4">${a.why.map(esc).join(' · ')}</div>`:''}</div><button class="btn sm ${i===0?'pri':''}" data-act="${b[1]}" ${b[1]==='madd'?`data-dk="${b[2]}"`:`data-id="${b[2]}"`}>${b[0]}</button></div>`}

 if(!(L>=7)){el.innerHTML='Exam date must be at least 7 days after the start date.';return}
 if(s.foundEnd){const fd=diffDays(st,parse(s.foundEnd));if(fd<0||fd>=L){el.innerHTML='Foundation must end between the start date and the day before the exam.';return}}
 const p=P(s),mc=countAuto(s);
 el.innerHTML=`${p.F?`<span style="color:var(--purple)">●</span> <b>Foundation</b> ${fmt(st)} – ${fmt(addDays(st,p.F-1))} (${p.F} days) · open workspace<br>`:''}<span style="color:var(--teal)">●</span> <b>Preparation</b> ${p.pe>p.F?fmt(addDays(st,p.F))+' – '+fmt(addDays(st,p.pe-1))+' ('+(p.pe-p.F)+' days)':'none'} · ${s.mock.type==='custom'?'you pick mock dates on the board':'~'+mc+' mocks ('+esc(mockRule(s))+')'}<br>${p.TPd?`<span style="color:var(--orange)">●</span> <b>Taper</b> ${p.TPd} day${p.TPd>1?'s':''} · `:''}<span style="color:var(--pink)">●</span> <b>CAT</b> ${esc(fmtLong(parse(s.exam)))}`}
function savePlan(f){const s=readPlan(f),st=parse(s.start),L=diffDays(st,parse(s.exam));
 if(!(L>=7)){toast('Exam date must be at least 7 days after start');return}
 if(s.foundEnd){const fd=diffDays(st,parse(s.foundEnd));if(fd<0||fd>=L){toast('Foundation must end before the exam');return}}
 if(s.mock.type==='weekly'&&!s.mock.days.length){toast('Pick at least one mock weekday');return}
 const first=!S.setup;S.setup=s;if(first)S.ui.tab='today';else closeSheet();commit();toast(first?'Plan created':'Plan updated')}
function formStart(f){const v=f.querySelector('[name=start]').value;return v?parse(v):new Date()}

/* ================= RENDER ================= */
function navState(){const t=S.setup?S.ui.tab:'';
 $('#side').innerHTML=`<div class="brand"><div class="logo">99</div>Sprint99</div>`+(S.setup?NAV.map(([k,l])=>`<button class="sb ${t===k?'on':''}" data-act="nav" data-t="${k}"><span class="tile" style="--tc:${NAVC[k]}">${I[k]}</span>${l}</button>`).join('')+`<button class="sb" data-act="settings"><span class="tile" style="--tc:${NAVC.settings}">${I.settings}</span>Settings</button>`:'')+`<div class="foot" id="saveState">${esc(saveTxt)}</div>`}
function render(){document.documentElement.dataset.theme=S.theme;
 if(!S.setup){$('#main').innerHTML=viewSetup();navState();updPlanInfo($('#setupForm'));return}
 const V={today:viewToday,plan:viewPlan,syllabus:viewSyl,mocks:viewMocks,insights:viewInsights};$('#main').innerHTML=(V[S.ui.tab]||viewToday)();navState()}
function reSheet(){if(SHEET)renderSheet()}

/* ================= ACTIONS ================= */
const ACT={
 nav:el=>{S.ui.tab=el.dataset.t;commit();window.scrollTo(0,0)},
 theme:()=>{S.theme=S.theme==='dark'?'light':'dark';commit();if(SHEET&&SHEET.type==='settings')renderSheet()},
 settings:()=>openSheet('settings'),
 close:()=>closeSheet(),
 pview:el=>{S.ui.planView=el.dataset.v;commit()},
 ins:el=>{S.ui.ins=el.dataset.v;commit()},
 jumptoday:()=>{const e=document.getElementById('d_'+dkey(new Date()));if(e)e.scrollIntoView({behavior:'smooth',block:'center'});else toast('Today is outside your plan')},
 dayopen:el=>openSheet('day',el.dataset.dk),
 daydone:el=>{const d=ensureDay(el.dataset.dk);d.done=!d.done;commit();reSheet();if(d.done)toast('Nice — day complete')},
 mocktog:el=>{const dk=el.dataset.dk,n=dayNo(parse(dk)),nv=!isMock(n);if(nv===autoMock(n))delete S.mockOv[dk];else S.mockOv[dk]=nv;commit();reSheet();toast(nv?'Mock added to this day':'Mock removed from this day')},
 dfsec:el=>{DF.sec=el.dataset.k;DF.topic='';reSheet()},
 dftimed:()=>{DF.timed=!DF.timed;reSheet()},
 dfadd:el=>{const dk=el.dataset.dk,sl=$('#dfTopic'),topic=sl?sl.value:DF.topic,text=(($('#dfText')||{}).value||'').trim(),att=Math.max(0,parseInt(($('#dfAtt')||{}).value)||0),cor=Math.min(Math.max(0,parseInt(($('#dfCor')||{}).value)||0),att);
  if(!topic&&!text){toast('Pick a topic or describe what you did');return}
  ensureDay(dk).items.push({id:uid(),sec:DF.sec,topic,text,att:att||'',cor:att?cor:'',timed:DF.timed});DF.topic=topic;DF.att='';DF.cor='';DF.text='';commit();reSheet();toast(att?'Added · '+cor+'/'+att+' ('+Math.round(cor/att*100)+'%)':'Added')},
 idel:el=>{const d=ensureDay(el.dataset.dk);d.items=d.items.filter(x=>x.id!==el.dataset.i);commit();reSheet()},
 logprac:el=>{const t=TP[el.dataset.id];if(!t)return;DF.sec=t.sec;DF.topic=t.id;openSheet('day',dkey(new Date()))},
 sylsec:el=>{S.ui.sylSec=el.dataset.k;if(S.ui.sylF==='weak')S.ui.sylF='all';commit()},
 sylf:el=>{S.ui.sylF=el.dataset.f;commit()},
 topen:el=>{const id=el.dataset.id;S.ui.open[id]=!S.ui.open[id];commit()},
 expall:()=>{const l=sylList(),o=l.every(t=>S.ui.open[t.id]);l.forEach(t=>{S.ui.open[t.id]=!o});commit()},
 mc:el=>{const id=el.dataset.id;S.syl[id]=((S.syl[id]||0)+1)%4;commit();reSheet()},
 tall:el=>{const t=TP[el.dataset.id],v=+el.dataset.v;t.subs.forEach((_,i)=>{S.syl[t.id+'.'+i]=v});commit()},
 opentopic:el=>{const t=TP[el.dataset.id];if(!t)return;closeSheet();S.ui.tab='syllabus';S.ui.sylSec=t.sec;S.ui.sylF='all';S.ui.open[t.id]=true;commit();setTimeout(()=>{const e=document.getElementById('t_'+t.id);if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},60)},
 madd:el=>openSheet('mockform',null,{date:(el&&el.dataset.dk)||dkey(new Date())}),
 mopen:el=>openSheet('mock',el.dataset.id),
 medit:el=>openSheet('mockform',el.dataset.id),
 mdel:el=>{const id=el.dataset.id;if(ARM!=='m'+id){ARM='m'+id;renderSheet();return}S.mocks=S.mocks.filter(m=>m.id!==id);closeSheet();commit();toast('Mock deleted')},
 pass:el=>{const m=getM(el.dataset.id);if(!m)return;m.ana=m.ana||{};m.ana[el.dataset.p]=!m.ana[el.dataset.p];commit();renderSheet()},
 efsec:el=>{EF.sec=el.dataset.k;EF.topic='';renderSheet()},
 eftype:el=>{EF.type=el.dataset.k;renderSheet()},
 eadd:el=>{const m=getM(el.dataset.id);if(!m)return;const sl=$('#efTopic'),topic=sl?sl.value:EF.topic,note=(($('#efNote')||{}).value||'').trim();if(!TP[topic])return;const rc=repeatCount(topic,EF.type,m.id),ty=ETYPES.find(x=>x.id===EF.type);
  m.errors=m.errors||[];m.errors.push({id:uid(),sec:EF.sec,topic,type:EF.type,note});EF.topic=topic;EF.note='';commit();renderSheet();toast(rc.c?'Repeat mistake — '+ordinal(rc.c+1)+' time: '+TP[topic].name+' · '+ty.name:'Logged · '+TP[topic].name)},
 edel:el=>{const m=getM(el.dataset.m);if(!m)return;m.errors=(m.errors||[]).filter(e=>e.id!==el.dataset.e);commit();renderSheet()},
 setlen:el=>{const f=el.closest('form');f.querySelector('[name=exam]').value=dkey(addDays(formStart(f),+el.dataset.v));updPlanInfo(f)},
 setcat:el=>{const f=el.closest('form');f.querySelector('[name=exam]').value='2026-11-29';updPlanInfo(f)},
 setfound:el=>{const f=el.closest('form'),v=+el.dataset.v;f.querySelector('[name=foundEnd]').value=v?dkey(addDays(formStart(f),v-1)):'';updPlanInfo(f)},
 exp:()=>{const data=JSON.stringify(S);try{const b=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sprint99-backup-'+dkey(new Date())+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600);toast('Backup downloaded')}catch(e){const ta=$('#impTxt');if(ta){ta.value=data;ta.select()}toast('Download blocked — copy the text instead')}},
 copy:()=>{const d=JSON.stringify(S),ta=$('#impTxt'),fb=()=>{if(ta){ta.value=d;ta.focus();ta.select()}toast('Select all and copy')};try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(d).then(()=>toast('Backup copied'),fb);else fb()}catch(e){fb()}},
 imp:()=>{const v=(($('#impTxt')||{}).value||'').trim();try{const o=migrate(JSON.parse(v));if(!o||!('syl' in o)||!('mocks' in o))throw 0;S=o;closeSheet();commit();toast('Backup restored')}catch(e){toast('That doesn’t look like a Sprint99 backup')}},
 reset:()=>{if(ARM!=='reset'){ARM='reset';renderSheet();return}const th=S.theme;S=fresh();S.theme=th;closeSheet();commit();toast('All data erased')}
};

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=ACT[el.dataset.act];if(a){e.preventDefault();a(el,e)}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();if(f.id==='mockForm')saveMockForm(f);else if(f.id==='setupForm'||f.id==='setForm')savePlan(f)});
function onField(e){const t=e.target;if(t.closest('#mockForm'))updPrev();const pf=t.closest('#setupForm,#setForm');if(pf)updPlanInfo(pf);if(t.id==='efNote')EF.note=t.value;if(t.id==='dfAtt')DF.att=t.value;if(t.id==='dfCor')DF.cor=t.value;if(t.id==='dfText')DF.text=t.value}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{const t=e.target;onField(e);if(t.id==='efTopic')EF.topic=t.value;if(t.id==='dfTopic'){DF.topic=t.value;reSheet()}
 if(t.dataset&&t.dataset.take){const m=getM(t.dataset.take);if(m){m.take=t.value;commit();toast('Saved')}}
 if(t.dataset&&t.dataset.dayhrs){ensureDay(t.dataset.dayhrs).hrs=t.value;commit()}
 if(t.dataset&&t.dataset.daynote){ensureDay(t.dataset.daynote).note=t.value;commit();toast('Saved')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEET)closeSheet()});

let touched=false;
(async function init(){let done=false;const apply=d=>{const m=migrate(d);if(m&&!touched)S=m;saveTxt=backend==='memory'?'Not saved — download a backup':'';render()};
 const t=setTimeout(()=>{if(!done)render()},2500);
 try{const d=await Store.load();done=true;clearTimeout(t);apply(d)}catch(e){done=true;clearTimeout(t);render()}})();
})();
</script>
</body>
</html>
